# Publishes the 96bulls services image to GHCR by digest.
# Manual only, and refuses to run unless the dispatcher types the confirmation
# phrase, because a registry write is a credential action that needs Khaliq's OK.
name: publish-image
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish 96bulls-services" to confirm Khaliq approved this publish'
        required: true
      ref_note:
        description: 'Where the approval was given (date, call/message)'
        required: true
      source_sha:
        description: 'Approved full 40-character public source commit with successful main CI'
        required: true
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'khaliqgant' && inputs.confirm == 'publish 96bulls-services' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      approval_note: ${{ steps.source.outputs.approval_note }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require approved source and successful exact-source CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
          APPROVAL_NOTE: ${{ inputs.ref_note }}
        run: node scripts/check-image-release.mjs
  publish:
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Only Khaliq may dispatch it, only from main, and only with the phrase; the job also runs in the
    # image-publish environment so a protection rule can add a second gate when the plan allows it.
    if: ${{ needs.preflight.result == 'success' && github.ref == 'refs/heads/main' && github.actor == 'khaliqgant' && inputs.confirm == 'publish 96bulls-services' }}
    environment: image-publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate requested source commit
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}
      # A customer image must come from a reviewed commit on main.
      - name: Verify the source commit is reviewed on main
        id: source
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "Checked out source differs from the requested commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual" origin/main; then
            echo "Refusing to publish ${actual}: it is not on main" >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Reviewed image source: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # This publisher never moves legacy main/latest tags across source histories.
          tags: |
            ghcr.io/agentworkforce/96bulls-services:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            96bulls.approval=${{ needs.preflight.outputs.approval_note }}
          # Customer releases need an SBOM and verifiable (max-mode) provenance;
          # the signed GitHub attestation below covers the pushed digest.
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # GitHub provenance identifies the workflow commit. Also bind the actual
      # reviewed checkout when publication deliberately uses an older source.
      - name: Attest reviewed image source
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://agentrelay.com/attestations/reviewed-image-source/v1
          predicate: >-
            {
              "repository": "${{ github.server_url }}/${{ github.repository }}",
              "source_sha": "${{ steps.source.outputs.sha }}",
              "workflow_sha": "${{ github.sha }}",
              "source_ref": "refs/heads/main",
              "ci_run_id": "${{ needs.preflight.outputs.ci_run_id }}"
            }
          push-to-registry: true
      - name: Digest
        run: |
          echo "ghcr.io/agentworkforce/96bulls-services@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
