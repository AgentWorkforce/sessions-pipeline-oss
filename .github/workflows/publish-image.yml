# Manual publication of the services image from reviewed public source.
name: publish-image
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish 96bulls-services" to confirm Khaliq approved publication'
        required: true
      ref_note:
        description: 'Short public approval reference (single line, no secrets)'
        required: true
      source_sha:
        description: 'Approved full lowercase source SHA on main with successful CI'
        required: true
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'khaliqgant' && github.triggering_actor == 'khaliqgant' && inputs.confirm == 'publish 96bulls-services' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      approval_note: ${{ steps.source.outputs.approval_note }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require approved source and successful exact-source CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM: ${{ inputs.confirm }}
          APPROVAL_NOTE: ${{ inputs.ref_note }}
        run: node scripts/check-image-release.mjs
  publish:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && github.ref == 'refs/heads/main' && github.actor == 'khaliqgant' && github.triggering_actor == 'khaliqgant' && inputs.confirm == 'publish 96bulls-services' }}
    environment: image-publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Keep the verifier from the trusted workflow commit, not the older image source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .publisher
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          path: .source
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recheck source after environment approval
        working-directory: .source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
          APPROVAL_NOTE: ${{ needs.preflight.outputs.approval_note }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node "$GITHUB_WORKSPACE/.publisher/scripts/check-image-release.mjs"
      - name: Set isolated registry configuration directory
        run: |
          mkdir -p "$RUNNER_TEMP/image-publish-docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/image-publish-docker" >> "$GITHUB_ENV"
      - name: Install OCI copy tool
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build without registry writes (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .source
          file: .source/docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/services.oci.tar
          tags: ghcr.io/agentworkforce/96bulls-services:sha-${{ needs.preflight.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.sha }}
            96bulls.approval=${{ needs.preflight.outputs.approval_note }}
          provenance: mode=max
          sbom: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck CI then copy the exact OCI index to its source-SHA tag
        working-directory: .source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
          APPROVAL_NOTE: ${{ needs.preflight.outputs.approval_note }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node "$GITHUB_WORKSPACE/.publisher/scripts/check-image-release.mjs"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo copy --all --preserve-digests --authfile "$DOCKER_CONFIG/config.json" \
            "oci-archive:$RUNNER_TEMP/services.oci.tar" \
            "docker://ghcr.io/agentworkforce/96bulls-services:sha-$SOURCE_SHA"
          skopeo inspect --raw --authfile "$DOCKER_CONFIG/config.json" \
            "docker://ghcr.io/agentworkforce/96bulls-services:sha-$SOURCE_SHA" > "$RUNNER_TEMP/registry-index.json"
          actual="sha256:$(sha256sum "$RUNNER_TEMP/registry-index.json" | cut -d ' ' -f 1)"
          test "$actual" = "$IMAGE_DIGEST"
      - name: Recheck source CI before signing
        id: final-source
        working-directory: .source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
          APPROVAL_NOTE: ${{ needs.preflight.outputs.approval_note }}
        run: node "$GITHUB_WORKSPACE/.publisher/scripts/check-image-release.mjs"
      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest reviewed image source
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://agentrelay.com/attestations/reviewed-image-source/v1
          predicate: >-
            {
              "repository": "${{ github.server_url }}/${{ github.repository }}",
              "source_sha": "${{ needs.preflight.outputs.sha }}",
              "workflow_sha": "${{ github.sha }}",
              "source_ref": "refs/heads/main",
              "ci_run_id": "${{ steps.final-source.outputs.ci_run_id }}"
            }
          push-to-registry: true
      - name: Record signed release receipt
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_CI_RUN: ${{ steps.final-source.outputs.ci_run_id }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          const e = process.env;
          if (!/^[0-9a-f]{40}$/.test(e.SOURCE_SHA) || !/^[0-9a-f]{40}$/.test(e.WORKFLOW_SHA) ||
              !/^sha256:[0-9a-f]{64}$/.test(e.IMAGE_DIGEST) || !/^[1-9][0-9]*$/.test(e.SOURCE_CI_RUN)) throw Error('Invalid receipt fields');
          const receipt = { repository: 'https://github.com/AgentWorkforce/sessions-pipeline-oss',
            image: `ghcr.io/agentworkforce/96bulls-services@${e.IMAGE_DIGEST}`,
            source_sha: e.SOURCE_SHA, workflow_sha: e.WORKFLOW_SHA, source_ref: 'refs/heads/main',
            ci_run_id: e.SOURCE_CI_RUN, publish_run_id: e.GITHUB_RUN_ID, publish_run_attempt: e.GITHUB_RUN_ATTEMPT };
          writeFileSync(`${e.RUNNER_TEMP}/release-receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          appendFileSync(e.GITHUB_STEP_SUMMARY, `Signed image: ${receipt.image}\nSource: ${receipt.source_sha}\nWorkflow: ${receipt.workflow_sha}\nSource CI: ${receipt.ci_run_id}\n`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
